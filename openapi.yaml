openapi: 3.0.3
info:
  title: PayFlow API
  version: "1.0.0"
  description: |
    Payment orchestration API for merchants. A merchant creates a Payment (starts
    `pending`), PayFlow asynchronously initiates it with the payment provider, and the
    Payment moves to `paid`/`failed` once the provider's webhook confirms the outcome -
    poll `GET /payments/{id}` (or, later, a merchant webhook) to observe the change.
    Refunds (partial or full) can be issued against a `paid`/`partially_refunded`
    payment; `sum(refunds) <= payment.amount` is enforced even under concurrent
    requests.

    All amounts are integers in the currency's smallest unit (e.g. haléře for CZK) -
    never a float.

servers:
  - url: http://127.0.0.1:8000/api
    description: Local development

security:
  - ApiKeyAuth: []

paths:
  /payments:
    get:
      summary: List the authenticated merchant's payments
      description: Always scoped to the authenticated merchant - never returns another merchant's payments.
      tags: [Payments]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PaymentStatus'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: A page of payments
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentCollection' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }

    post:
      summary: Create a payment
      description: |
        Creates a new Payment in `pending` status and asynchronously initiates it with
        the payment provider. Idempotent: repeating the same `Idempotency-Key` with the
        same parameters returns the original Payment (`200`) instead of creating a
        duplicate; the same key with *different* parameters is a `409`.
      tags: [Payments]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, amount, currency]
              properties:
                order_id:
                  type: string
                  maxLength: 255
                  example: order-1234
                amount:
                  type: integer
                  minimum: 1
                  description: Minor units.
                  example: 259900
                currency:
                  type: string
                  pattern: '^[A-Z]{3}$'
                  example: CZK
                return_url:
                  type: string
                  format: uri
                  nullable: true
                callback_url:
                  type: string
                  format: uri
                  nullable: true
      responses:
        '201':
          description: Payment created
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentResource' }
        '200':
          description: Idempotent replay of an existing payment (same key, same parameters)
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentResource' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /payments/{payment}:
    get:
      summary: Get a single payment
      description: |
        Returns `404` (not `403`) if the payment belongs to a different merchant, or
        doesn't exist at all - the two cases are deliberately indistinguishable from the
        response.
      tags: [Payments]
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: The payment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentResource' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /payments/{payment}/refunds:
    get:
      summary: List refunds for a payment
      tags: [Refunds]
      parameters:
        - $ref: '#/components/parameters/PaymentId'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: A page of refunds
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundCollection' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

    post:
      summary: Refund a payment (partial or full)
      description: |
        `sum(refunds) <= payment.amount` is enforced under a database row lock, so this
        is safe even if two refund requests for the same payment arrive at the same
        time - a `409 refund_exceeds_remaining_amount` means the requested amount
        exceeds what's left, evaluated against the true current total, not a stale read.
        Idempotent the same way payment creation is, scoped per payment.
      tags: [Refunds]
      parameters:
        - $ref: '#/components/parameters/PaymentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount:
                  type: integer
                  minimum: 1
                  description: Minor units. Must not exceed the payment's remaining refundable amount.
                  example: 3000
      responses:
        '201':
          description: Refund created
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundResource' }
        '200':
          description: Idempotent replay of an existing refund (same key, same amount)
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundResource' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Idempotency-Key conflict, or the amount exceeds what's left to refund
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /refunds/{refund}:
    get:
      summary: Get a single refund
      description: Same 404-not-403 reasoning as GET /payments/{payment}.
      tags: [Refunds]
      parameters:
        - name: refund
          in: path
          required: true
          schema: { type: string, format: ulid }
      responses:
        '200':
          description: The refund
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundResource' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: |
        Merchant API key, issued out-of-band (no public self-registration endpoint
        exists yet). Send as `Authorization: Bearer <api_key>`.

  parameters:
    PaymentId:
      name: payment
      in: path
      required: true
      schema: { type: string, format: ulid }
      example: 01m05qm3ynrvzyadc8tset4xp5
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, maxLength: 255 }
      description: Client-generated key. Ensures the same logical operation is never performed twice, including under concurrent retries.
    PerPage:
      name: per_page
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 15 }

  responses:
    Unauthenticated:
      description: Missing, invalid, or deactivated API key
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: unauthenticated, message: "Invalid or missing API key." } }
    NotFound:
      description: Resource does not exist, or belongs to a different merchant
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: not_found, message: "The requested resource was not found." } }
    ValidationError:
      description: The request body or query parameters failed validation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    IdempotencyConflict:
      description: The Idempotency-Key was already used with different parameters
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: idempotency_key_conflict, message: "Idempotency-Key [...] was already used with different request parameters." } }

  schemas:
    PaymentStatus:
      type: string
      enum: [pending, authorized, paid, partially_refunded, refunded, failed]

    Payment:
      type: object
      required: [id, order_id, amount, currency, status, idempotency_key, created_at, updated_at]
      properties:
        id: { type: string, format: ulid, example: 01m05qm3ynrvzyadc8tset4xp5 }
        order_id: { type: string, example: order-1234 }
        amount: { type: integer, example: 259900 }
        currency: { type: string, example: CZK }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        idempotency_key: { type: string }
        return_url: { type: string, format: uri, nullable: true }
        callback_url: { type: string, format: uri, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PaymentResource:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Payment' }

    PaymentCollection:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Payment' }
        links: { $ref: '#/components/schemas/PaginationLinks' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    Refund:
      type: object
      required: [id, payment_id, amount, idempotency_key, created_at]
      properties:
        id: { type: string, format: ulid }
        payment_id: { type: string, format: ulid }
        amount: { type: integer, example: 3000 }
        idempotency_key: { type: string }
        created_at: { type: string, format: date-time }

    RefundResource:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Refund' }

    RefundCollection:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Refund' }
        links: { $ref: '#/components/schemas/PaginationLinks' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    PaginationLinks:
      type: object
      properties:
        first: { type: string, nullable: true }
        last: { type: string, nullable: true }
        prev: { type: string, nullable: true }
        next: { type: string, nullable: true }

    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer }
        from: { type: integer, nullable: true }
        last_page: { type: integer }
        path: { type: string }
        per_page: { type: integer }
        to: { type: integer, nullable: true }
        total: { type: integer }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: validation_failed }
            message: { type: string }
            details:
              type: object
              nullable: true
              additionalProperties: true
              description: Present on validation_failed - field name to array of messages.
