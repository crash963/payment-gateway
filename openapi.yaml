openapi: 3.0.3
info:
  title: PayFlow API
  version: "1.0.0"
  description: |
    Payment orchestration API for merchants. A merchant creates a Payment (starts
    `pending`), PayFlow asynchronously initiates it with the payment provider, and the
    Payment moves to `paid`/`failed` once the provider's webhook confirms the outcome -
    poll `GET /payments/{id}` (or, later, a merchant webhook) to observe the change.
    Refunds (partial or full) can be issued against a `paid`/`partially_refunded`
    payment; `sum(refunds) <= payment.amount` is enforced even under concurrent
    requests.

    All amounts are integers in the currency's smallest unit (e.g. haléře for CZK) -
    never a float.

servers:
  - url: http://127.0.0.1:8000/api
    description: Local development

security:
  - ApiKeyAuth: []

paths:
  /payments:
    get:
      summary: List the authenticated merchant's payments
      description: Always scoped to the authenticated merchant - never returns another merchant's payments.
      tags: [Payments]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PaymentStatus'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: A page of payments
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentCollection' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

    post:
      summary: Create a payment
      description: |
        Creates a new Payment in `pending` status and asynchronously initiates it with
        the payment provider. Idempotent: repeating the same `Idempotency-Key` with the
        same parameters returns the original Payment (`200`) instead of creating a
        duplicate; the same key with *different* parameters is a `409`.
      tags: [Payments]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, amount, currency]
              properties:
                order_id:
                  type: string
                  maxLength: 255
                  example: order-1234
                amount:
                  type: integer
                  minimum: 1
                  description: Minor units.
                  example: 259900
                currency:
                  type: string
                  pattern: '^[A-Z]{3}$'
                  example: CZK
                return_url:
                  type: string
                  format: uri
                  nullable: true
                callback_url:
                  type: string
                  format: uri
                  nullable: true
      responses:
        '201':
          description: Payment created
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentResource' }
        '200':
          description: Idempotent replay of an existing payment (same key, same parameters)
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentResource' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /payments/{payment}:
    get:
      summary: Get a single payment
      description: |
        Returns `404` (not `403`) if the payment belongs to a different merchant, or
        doesn't exist at all - the two cases are deliberately indistinguishable from the
        response.
      tags: [Payments]
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: The payment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentResource' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /payments/{payment}/refunds:
    get:
      summary: List refunds for a payment
      tags: [Refunds]
      parameters:
        - $ref: '#/components/parameters/PaymentId'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: A page of refunds
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundCollection' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

    post:
      summary: Refund a payment (partial or full)
      description: |
        `sum(refunds) <= payment.amount` is enforced under a database row lock, so this
        is safe even if two refund requests for the same payment arrive at the same
        time - a `409 refund_exceeds_remaining_amount` means the requested amount
        exceeds what's left, evaluated against the true current total, not a stale read.
        Idempotent the same way payment creation is, scoped per payment.
      tags: [Refunds]
      parameters:
        - $ref: '#/components/parameters/PaymentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount:
                  type: integer
                  minimum: 1
                  description: Minor units. Must not exceed the payment's remaining refundable amount.
                  example: 3000
      responses:
        '201':
          description: Refund created
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundResource' }
        '200':
          description: Idempotent replay of an existing refund (same key, same amount)
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundResource' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Idempotency-Key conflict, or the amount exceeds what's left to refund
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /refunds/{refund}:
    get:
      summary: Get a single refund
      description: Same 404-not-403 reasoning as GET /payments/{payment}.
      tags: [Refunds]
      parameters:
        - name: refund
          in: path
          required: true
          schema: { type: string, format: ulid }
      responses:
        '200':
          description: The refund
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundResource' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /copilot/chat:
    post:
      summary: Chat with the AI Integration Copilot
      description: |
        Stateless: the server persists nothing between requests. The client resends
        the full conversation history each turn (see `conversation` in the response
        below) plus the new message; on the next turn, send that same array back with
        one more message appended.

        The assistant automatically calls read-only tools scoped to the authenticated
        merchant (`getPayment`, `getPaymentEvents`, `getWebhookDeliveries`,
        `searchDocumentation`) - it can never see or act on another merchant's data,
        regardless of what it's asked. The one write-capable tool, `resendWebhook`, is
        human-in-the-loop: the assistant first returns a description of the proposed
        action without executing it (surfaced in `conversation` as a tool message with
        `requires_confirmation: true`); only send a follow-up user message containing
        the merchant's explicit confirmation for the assistant to call it again with
        `confirmed: true` and actually perform it.

        Rate limited more strictly than the rest of the API (10/min, not 60) - every
        call can trigger a real OpenAI API request. See
        storage/docs/12-ai-integration-copilot.md for the full design.
      tags: [Copilot]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CopilotChatRequest' }
      responses:
        '200':
          description: |
            The assistant's reply for this turn, plus the full updated conversation to
            resend on the next one. `message` is null when the assistant's last action
            this turn was a tool call with no accompanying text (e.g. it's still
            waiting on results, or just proposed a write action for confirmation) -
            inspect `conversation` for the tool-call/tool-result detail in that case.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CopilotChatResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: |
        Merchant API key, issued out-of-band (no public self-registration endpoint
        exists yet). Send as `Authorization: Bearer <api_key>`.

  parameters:
    PaymentId:
      name: payment
      in: path
      required: true
      schema: { type: string, format: ulid }
      example: 01m05qm3ynrvzyadc8tset4xp5
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, maxLength: 255 }
      description: Client-generated key. Ensures the same logical operation is never performed twice, including under concurrent retries.
    PerPage:
      name: per_page
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 15 }

  responses:
    Unauthenticated:
      description: Missing, invalid, or deactivated API key
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: unauthenticated, message: "Invalid or missing API key." } }
    NotFound:
      description: Resource does not exist, or belongs to a different merchant
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: not_found, message: "The requested resource was not found." } }
    ValidationError:
      description: The request body or query parameters failed validation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    IdempotencyConflict:
      description: The Idempotency-Key was already used with different parameters
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: idempotency_key_conflict, message: "Idempotency-Key [...] was already used with different request parameters." } }
    TooManyRequests:
      description: |
        Rate limit exceeded for this endpoint (limits vary by route - stricter for
        /copilot/chat than the rest of the API, see storage/docs/14-rate-limiting.md).
        Retry after the number of seconds in the `Retry-After` header.
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds until the limit resets.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: too_many_requests, message: "Too many requests. Please slow down and try again." } }

  schemas:
    PaymentStatus:
      type: string
      enum: [pending, authorized, paid, partially_refunded, refunded, failed]

    Payment:
      type: object
      required: [id, order_id, amount, currency, status, idempotency_key, created_at, updated_at]
      properties:
        id: { type: string, format: ulid, example: 01m05qm3ynrvzyadc8tset4xp5 }
        order_id: { type: string, example: order-1234 }
        amount: { type: integer, example: 259900 }
        currency: { type: string, example: CZK }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        idempotency_key: { type: string }
        return_url: { type: string, format: uri, nullable: true }
        callback_url: { type: string, format: uri, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PaymentResource:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Payment' }

    PaymentCollection:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Payment' }
        links: { $ref: '#/components/schemas/PaginationLinks' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    Refund:
      type: object
      required: [id, payment_id, amount, idempotency_key, created_at]
      properties:
        id: { type: string, format: ulid }
        payment_id: { type: string, format: ulid }
        amount: { type: integer, example: 3000 }
        idempotency_key: { type: string }
        created_at: { type: string, format: date-time }

    RefundResource:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Refund' }

    RefundCollection:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Refund' }
        links: { $ref: '#/components/schemas/PaginationLinks' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    PaginationLinks:
      type: object
      properties:
        first: { type: string, nullable: true }
        last: { type: string, nullable: true }
        prev: { type: string, nullable: true }
        next: { type: string, nullable: true }

    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer }
        from: { type: integer, nullable: true }
        last_page: { type: integer }
        path: { type: string }
        per_page: { type: integer }
        to: { type: integer, nullable: true }
        total: { type: integer }

    CopilotMessage:
      type: object
      required: [role]
      description: |
        One turn of the conversation. Shape varies by `role`, matching OpenAI's Chat
        Completions message format directly (this API is a thin, scoped wrapper
        around it, not a reinterpretation) - a `user`/`system` turn has `content`, an
        `assistant` turn that called a tool has `tool_calls` instead (or as well as)
        `content`, and a `tool` turn (a tool's result, fed back to the model) has
        `tool_call_id` and `content`. Clients don't need to construct these by hand -
        send a `user` message with just `content`, then echo back whatever the
        previous response's `conversation` contained.
      properties:
        role: { type: string, enum: [user, assistant, tool, system] }
        content: { type: string, nullable: true }
        tool_call_id:
          type: string
          nullable: true
          description: Present on `tool` messages - which tool call this is the result of.
        tool_calls:
          type: array
          nullable: true
          items: { type: object }
          description: Present on `assistant` messages that invoked one or more tools. Passed through as OpenAI returned it.

    CopilotChatRequest:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/CopilotMessage' }

    CopilotChatResponse:
      type: object
      properties:
        message:
          type: string
          nullable: true
          description: The assistant's final text reply for this turn, or null - see the 200 response description above.
        conversation:
          type: array
          items: { $ref: '#/components/schemas/CopilotMessage' }
          description: Full history so far (everything sent, plus everything the assistant/tools produced this turn). Send this back verbatim, with one more user message appended, on the next call.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: validation_failed }
            message: { type: string }
            details:
              type: object
              nullable: true
              additionalProperties: true
              description: Present on validation_failed - field name to array of messages.
